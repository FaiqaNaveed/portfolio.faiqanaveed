<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Portfolio Launch Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg0:#070b16; --bg1:#0c1424; --bg2:#0a1220;
    --ink:#e8ecf6; --ink-dim:#9aa4c0;
    --accent:#22e0c4; --mint:#7cf2df; --accent-2:#6f7bff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Sora',sans-serif;
    background:
      radial-gradient(1200px 900px at 78% -8%, rgba(34,224,196,.14), transparent 60%),
      radial-gradient(1000px 800px at 12% 108%, rgba(111,123,255,.12), transparent 60%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    color:var(--ink);
    position:relative; overflow:hidden;
  }
  /* dotted coverage lattice */
  .lattice{position:absolute;inset:0;
    background-image:radial-gradient(rgba(154,164,192,.16) 2px, transparent 2px);
    background-size:46px 46px; mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);
    opacity:.5;}
  .frame{position:absolute;inset:54px;border:1px solid rgba(154,164,192,.18);border-radius:34px;}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
    padding:132px 118px;}

  /* top status row */
  .top{display:flex;align-items:center;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--ink-dim);
    letter-spacing:.06em;}
  .pill{display:inline-flex;align-items:center;gap:14px;
    border:1px solid rgba(34,224,196,.35);border-radius:999px;
    padding:14px 26px;color:var(--mint);background:rgba(34,224,196,.06);}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(34,224,196,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,224,196,.55)}70%{box-shadow:0 0 0 22px rgba(34,224,196,0)}100%{box-shadow:0 0 0 0 rgba(34,224,196,0)}}
  .brand{color:var(--ink);font-weight:700;font-family:'Sora';font-size:30px;}
  .brand b{color:var(--accent);}

  /* hero block */
  .hero{margin-top:auto;margin-bottom:auto;}
  .eyebrow{font-family:'JetBrains Mono',monospace;color:var(--accent);
    font-size:30px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:34px;}
  .headline{font-weight:800;font-size:150px;line-height:.96;letter-spacing:-.02em;}
  .headline .live{display:block;color:transparent;
    background:linear-gradient(120deg,var(--accent),var(--mint));
    -webkit-background-clip:text;background-clip:text;}
  .rule{width:150px;height:5px;border-radius:4px;margin:56px 0;
    background:linear-gradient(90deg,var(--accent),transparent);}
  .name{font-weight:700;font-size:72px;letter-spacing:-.01em;}
  .name span{color:var(--accent);}
  .role{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);
    font-size:34px;margin-top:22px;letter-spacing:.02em;}
  .tag{margin-top:46px;font-size:40px;font-weight:300;font-style:italic;
    color:var(--ink);line-height:1.35;max-width:760px;}
  .tag .q{color:var(--accent);font-style:normal;font-weight:600;}

  /* endpoint footer */
  .foot{margin-top:auto;}
  .checks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:52px;
    font-family:'JetBrains Mono',monospace;font-size:27px;}
  .chk{display:inline-flex;align-items:center;gap:12px;color:var(--ink-dim);
    border:1px solid rgba(154,164,192,.2);border-radius:10px;padding:12px 20px;}
  .chk b{color:var(--accent);font-weight:600;}
  .url{display:flex;align-items:center;gap:24px;
    border-top:1px solid rgba(154,164,192,.18);padding-top:44px;}
  .url .label{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);font-size:28px;}
  .url .link{font-family:'JetBrains Mono',monospace;font-weight:600;
    font-size:40px;color:var(--ink);}
  .url .link b{color:var(--accent);}
  .arrow{margin-left:auto;font-size:52px;color:var(--accent);}
</style>
</head>
<body>
  <div class="lattice"></div>
  <div class="frame"></div>
  <div class="wrap">
    <div class="top">
      <span class="pill"><span class="dot"></span> DEPLOYED · PRODUCTION</span>
      <span class="brand">faiqa<b>.qa</b></span>
    </div>

    <div class="hero">
      <p class="eyebrow">// build passed — shipping</p>
      <h1 class="headline">My Portfolio<span class="live">is LIVE</span></h1>
      <div class="rule"></div>
      <p class="name">Faiqa Naveed <span>Ashraf</span></p>
      <p class="role">Sr. SQA Engineer · AI QA Specialist</p>
      <p class="tag"><span class="q">“</span>Quality is not an act,<br/>it's a habit.<span class="q">”</span></p>
    </div>

    <div class="foot">
      <div class="checks">
        <span class="chk"><b>✓</b> Automation</span>
        <span class="chk"><b>✓</b> AI / LLM QA</span>
        <span class="chk"><b>✓</b> 5+ Years</span>
        <span class="chk"><b>✓</b> Zero Frameworks</span>
      </div>
      <div class="url">
        <span class="label">$ open</span>
        <span class="link">portfolio-faiqanaveed<b>.vercel.app</b></span>
        <span class="arrow">↗</span>
      </div>
    </div>
  </div>
</body>
</html>
